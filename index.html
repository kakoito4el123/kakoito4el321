<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Game Launcher</title>
<style>

        :root {
            --bg-gradient: linear-gradient(-45deg, #0f0c1b, #16102b, #0b192c, #080811);
            --sidebar-bg: rgba(15, 15, 25, 0.4);
            --text-color: #ffffff;
            --text-muted: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.05);
            --accent-glow: rgba(59, 130, 246, 0.15);
            --btn-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }

        body.light-theme {
            --bg-gradient: linear-gradient(-45deg, #f0f2f5, #e2e8f0, #dbeafe, #edf2f7);
            --sidebar-bg: rgba(255, 255, 255, 0.6);
            --text-color: #1e293b;
            --text-muted: #64748b;
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(0, 0, 0, 0.06);
            --accent-glow: rgba(59, 130, 246, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            transition: background 0.5s ease, color 0.3s ease;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Кастомный красивый скроллбар для внутренних блоков, чтобы не было дефолтных белых полос */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        body.light-theme ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
        }

        .sidebar {
            width: 240px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            padding: 20px 10px;
            box-sizing: border-box;
            justify-content: space-between;
            z-index: 10;
        }

        .logo-area h2 {
            margin: 0;
            text-align: center;
            padding: 10px 0 30px 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            background: linear-gradient(45deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .nav-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 14px 18px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.25s ease;
        }

        .nav-btn:hover {
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(4px);
        }

        .nav-btn.active {
            color: var(--text-color);
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.2) 0%, rgba(148, 85, 247, 0.1) 100%);
            border-left: 3px solid #3b82f6;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .bottom-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .theme-btn, .action-btn {
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            color: var(--text-color);
        }

        .theme-btn:hover { background: #3b82f6; color: white; }
        .action-btn { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
        .action-btn:hover { background: #ef4444; color: white; }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 40px;
            box-sizing: border-box;
            overflow: hidden; /* Фикс: запрещаем скролл всей панели контента, скроллиться будут только внутренние списки */
        }

        .page-panel {
            animation: fadeIn 0.4s ease-out;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .welcome-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            max-width: 600px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        .core-btn {
            background: var(--btn-gradient);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .core-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); }

        /* ЭЛЕМЕНТЫ ИНТЕРФЕЙСА ЗАМЕТОК */
        .todo-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .todo-input {
            flex-grow: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 12px 16px;
            font-size: 16px;
            border-radius: 12px;
            outline: none;
        }
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .todo-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--card-border);
            padding: 14px 18px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }
        body.light-theme .todo-item { background: rgba(0,0,0,0.02); }

        .todo-delete-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .todo-delete-btn:hover { background: rgba(239, 68, 68, 0.1); }

        /* РАНДОМ И ТАЙМЕР СТИЛИ */
        .random-display { font-size: 72px; font-weight: 800; color: #3b82f6; margin: 20px 0; text-shadow: 0 0 30px rgba(59, 130, 246, 0.4); }
        .timer-display { font-size: 64px; font-weight: 700; font-family: monospace; color: #10b981; margin: 20px 0; }
        .timer-input { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-color); padding: 10px; font-size: 20px; border-radius: 10px; width: 80px; text-align: center; margin-bottom: 15px; }

        /* ИГРОТЕКА И КАТАЛОГ ИГР */
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; overflow-y: auto; }
        .game-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; transition: transform 0.2s, box-shadow 0.2s; }
        .game-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        .game-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .game-icon { font-size: 32px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px; }
        .game-title { font-size: 18px; font-weight: 700; margin: 0; color: var(--text-color); }
        .game-genre { font-size: 12px; color: #3b82f6; background: rgba(59, 130, 246, 0.1); padding: 2px 8px; border-radius: 12px; display: inline-block; }
        .game-desc { font-size: 13px; color: var(--text-muted); line-height: 1.4; flex-grow: 1; }
        .game-meta { font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; border-top: 1px solid var(--card-border); padding-top: 10px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* --- СТИЛИ ДЛЯ ВКЛАДКИ ПРОФИЛЯ --- */
        .profile-container { display: flex; gap: 30px; align-items: center; margin-bottom: 30px; }
        .profile-avatar {
            width: 100px; height: 100px; border-radius: 50%;
            background: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%);
            display: flex; justify-content: center; align-items: center;
            font-size: 42px; box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
        }
        .profile-details h2 { margin: 0 0 5px 0; font-size: 26px; }
        .profile-badge { background: rgba(59, 130, 246, 0.15); color: #3b82f6; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
        .info-row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--card-border); font-size: 15px; }
        .info-row span:first-child { color: var(--text-muted); }
        .info-row span:last-child { font-weight: 600; }

        /* --- ИСПРАВЛЕННЫЕ СТИЛИ ДЛЯ ДВУХПАНЕЛЬНОГО ЧАТА --- */
        .chat-container-block {
            display: flex;
            flex-grow: 1;
            height: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            overflow: hidden;
            box-sizing: border-box;
        }

        .chat-sidebar {
            width: 280px;
            flex: 0 0 280px;
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--card-border);
        }

        .friends-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .friend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .friend-item:hover { background: rgba(255,255,255,0.05); }
        .friend-status-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; }

        .chat-main-area {
            flex-grow: 1;
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: transparent;
            position: relative;
        }

        .chat-history {
            flex-grow: 1;
            min-width: 0;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }

        .chat-message {
            display: flex;
            flex-direction: column;
            width: fit-content;
            max-width: min(70%, calc(100% - 48px));
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            box-sizing: border-box;
            overflow-wrap: anywhere;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .chat-message.my-msg {
            align-self: flex-end;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border-bottom-right-radius: 2px;
        }
        .chat-message.other-msg {
            align-self: flex-start;
            background: rgba(255,255,255,0.05);
            color: var(--text-color);
            border-bottom-left-radius: 2px;
            border: 1px solid var(--card-border);
        }

        .msg-meta { font-size: 11px; opacity: 0.7; font-weight: bold; margin-bottom: 3px; }
        .msg-content { min-width: 0; max-width: 100%; }
        .msg-time { font-size: 10px; align-self: flex-end; margin-top: 5px; opacity: 0.6; white-space: nowrap; }
        .msg-read-mark { margin-left: 4px; }
        .msg-time.sending { opacity: 0.75; }
        .msg-time.error { color: #fecaca; opacity: 1; }
        .chat-img-preview { display: block; max-width: min(250px, 100%); border-radius: 8px; margin-top: 5px; }

        .chat-input-panel {
            padding: 15px 20px;
            border-top: 1px solid var(--card-border);
            background: rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 10px;
            align-items: center;
            box-sizing: border-box;
            width: 100%;
        }
        .chat-input-panel .core-btn { flex: 0 0 auto; }
        #chat-message-input { flex: 1 1 auto; min-width: 0; }

        /* Стиль для размытия чата у неавторизованных гостей */
        .chat-blur-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 12, 27, 0.8); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; gap: 15px; text-align: center;
        }

        .notification-launcher {
            position: fixed; top: 18px; right: 24px; z-index: 1000;
            border: 1px solid var(--card-border); border-radius: 14px;
            background: var(--card-bg); color: var(--text-color); padding: 10px 14px;
            cursor: pointer; backdrop-filter: blur(14px); font-size: 18px;
        }
        .notification-badge {
            position: absolute; top: -7px; right: -7px; min-width: 19px; height: 19px;
            border-radius: 10px; background: #ef4444; color: white; font-size: 11px;
            display: none; align-items: center; justify-content: center; font-weight: 700;
        }
        .notification-panel {
            position: fixed; top: 62px; right: 24px; width: 390px; max-height: 70vh;
            z-index: 999; display: none; flex-direction: column; overflow: hidden;
            background: rgba(18, 20, 35, .97); border: 1px solid var(--card-border);
            border-radius: 18px; box-shadow: 0 18px 60px rgba(0,0,0,.45);
        }
        body.light-theme .notification-panel { background: rgba(255,255,255,.98); }
        .notification-tabs { display: flex; gap: 5px; padding: 12px; border-bottom: 1px solid var(--card-border); }
        .notification-tabs button { flex: 1; border: 0; border-radius: 8px; padding: 7px 4px; cursor: pointer; background: transparent; color: var(--text-muted); }
        .notification-tabs button.active { background: rgba(59,130,246,.2); color: var(--text-color); }
        .category-badge { display: inline-flex; min-width: 16px; height: 16px; align-items: center; justify-content: center; border-radius: 9px; background: #ef4444; color: white; font-size: 10px; margin-left: 2px; }
        .category-badge:empty { display: none; }
        .notification-list { overflow-y: auto; padding: 8px; }
        .notification-item { padding: 12px; border-radius: 12px; margin-bottom: 6px; background: rgba(255,255,255,.04); }
        .notification-item.unread { border-left: 3px solid #3b82f6; }
        .notification-title { font-weight: 700; margin-bottom: 4px; }
        .notification-body { color: var(--text-muted); font-size: 13px; line-height: 1.35; }
        .notification-time { color: var(--text-muted); font-size: 11px; margin-top: 6px; }
        .app-version { position: fixed; right: 24px; bottom: 14px; color: var(--text-muted); font-size: 11px; z-index: 20; }
        .update-action { margin: 8px 12px 12px; display:flex; gap:8px; }
        .update-action button { flex:1; padding:8px; border:0; border-radius:8px; cursor:pointer; background:rgba(16,185,129,.18); color:#34d399; }
        .account-switcher { display:flex; gap:8px; align-items:center; }
        .account-plus { width:42px; height:42px; border-radius:12px; border:1px solid var(--card-border); background:rgba(59,130,246,.15); color:var(--text-color); font-size:24px; cursor:pointer; }
        .account-modal { position:fixed; inset:0; z-index:2000; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.65); }
        .account-box { width:390px; max-width:90vw; padding:24px; border-radius:20px; background:var(--card-bg); border:1px solid var(--card-border); backdrop-filter:blur(16px); }
        .account-box input { width:100%; box-sizing:border-box; margin:7px 0; }
        .account-search-results { max-height:130px; overflow:auto; margin:5px 0 12px; }
        .account-result { padding:8px; border-radius:8px; cursor:pointer; color:var(--text-muted); }
        .account-result:hover { background:rgba(59,130,246,.15); color:var(--text-color); }

</style>
</head>
<body>
    <button class="notification-launcher" onclick="toggleNotificationCenter()" aria-label="Уведомления">🔔<span id="notification-badge" class="notification-badge">0</span></button>
    <div id="notification-panel" class="notification-panel">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:15px 15px 5px;">
            <strong>Центр событий</strong>
            <button onclick="markAllNotificationsRead()" style="background:none;border:0;color:#60a5fa;cursor:pointer;">Прочитать всё</button>
        </div>
        <div class="notification-tabs">
            <button class="active" data-category="all" onclick="filterNotifications('all', this)">Все <span class="category-badge"></span></button>
            <button data-category="system" onclick="filterNotifications('system', this)">Система <span class="category-badge"></span></button>
            <button data-category="friends" onclick="filterNotifications('friends', this)">Друзья <span class="category-badge"></span></button>
            <button data-category="messages" onclick="filterNotifications('messages', this)">Чаты <span class="category-badge"></span></button>
            <button data-category="updates" onclick="filterNotifications('updates', this)">Обновления <span class="category-badge"></span></button>
        </div>
        <div class="update-action"><button onclick="checkAndInstallUpdate()">⟳ Проверить обновления</button></div>
        <div id="notification-list" class="notification-list"><div style="padding:20px;color:var(--text-muted);">Загрузка...</div></div>
    </div>
    <div id="app-version" class="app-version">Версия: …</div>

    <div class="sidebar">
        <div class="logo-area">
            <h2>NEXT-GEN HUB</h2>
        </div>

        <div class="nav-links">
            <button class="nav-btn active" onclick="switchTab(this, 'main')">🏠 Главная</button>
            <button class="nav-btn" onclick="switchTab(this, 'random')">🎲 Рандом</button>
            <button class="nav-btn" onclick="switchTab(this, 'todo')">📝 Заметки</button>
            <button class="nav-btn" onclick="switchTab(this, 'timer')">⏰ Таймер</button>
            <button class="nav-btn" onclick="switchTab(this, 'games')">🎮 Игротека</button>
            <button class="nav-btn" onclick="switchTab(this, 'profile')">👤 Профиль</button>
            <button class="nav-btn" onclick="switchTab(this, 'chat')">💬 Чат</button>
        </div>

        <div class="bottom-area">
            <div class="account-switcher"><span style="color:var(--text-muted);font-size:12px;">Аккаунты</span><button class="account-plus" onclick="openAccountManager()" aria-label="Добавить аккаунт">+</button></div>
            <button class="theme-btn" id="theme-toggle-btn" onclick="toggleTheme()">🌙 Тёмная тема</button>
            <button class="action-btn" onclick="exitLauncher()">✖ Выйти</button>
        </div>
        <div id="account-modal" class="account-modal" onclick="if(event.target===this) closeAccountManager()">
            <div class="account-box">
                <div style="display:flex;justify-content:space-between;align-items:center;"><h3 style="margin:0;">Добавить аккаунт</h3><button onclick="closeAccountManager()" style="background:none;border:0;color:var(--text-muted);font-size:22px;cursor:pointer;">×</button></div>
                <p style="color:var(--text-muted);font-size:13px;">Аккаунт сохранится только в профиле текущего аккаунта.</p>
                <input id="saved-account-nick" class="todo-input" placeholder="Никнейм" oninput="searchSavedAccountUsers(this.value)">
                <input id="saved-account-phone" class="todo-input" placeholder="Номер телефона">
                <div id="saved-account-results" class="account-search-results"></div>
                <input id="saved-account-password" class="todo-input" type="password" placeholder="Пароль">
                <div id="saved-account-status" style="font-size:13px;min-height:20px;"></div>
                <button class="core-btn" style="width:100%;margin-top:10px;" onclick="saveAccountFromManager()">Проверить и запомнить</button>
                <div id="saved-accounts-list" style="margin-top:16px;"></div>
            </div>
        </div>
    </div>

    <div class="main-content" id="content-area">
        <div class="page-panel" id="page-main">
            <div class="welcome-card">
                <h1 style="margin:0 0 15px 0; font-size:36px;">ГЛАВНОЕ МЕНЮ</h1>
                <p>Добро пожаловать в твою новую экосистему. Весь бэкэнд работает на Python, а интерфейс обрабатывается видеокартой для максимальной плавности.</p>
            </div>
        </div>

    </div>


    <script>
        let gameStatusInterval = null;
                // 2. Вызывай её только ОДИН РАЗ при инициализации
        document.addEventListener("DOMContentLoaded", () => {
            loadFriendsList();
            loadNotifications();
            loadAppVersion();
            setInterval(loadNotifications, 5000);
        });
        let countdownInterval = null;
        let launcherNotifications = [];
        let notificationCategory = 'all';

        function loadAppVersion() {
            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.get_app_version().then(function(version) {
                    document.getElementById('app-version').innerText = 'Версия: ' + version;
                });
            }
        }

        function checkAndInstallUpdate() {
            if (!(window.pywebview && window.pywebview.api)) return;
            const button = document.querySelector('.update-action button');
            button.disabled = true;
            button.innerText = 'Проверка…';
            window.pywebview.api.check_launcher_update().then(function(result) {
                if (result.has_update) {
                    button.disabled = false;
                    button.innerText = '⬆ Установить v' + result.latest_version;
                    button.onclick = function() {
                        button.disabled = true;
                        button.innerText = 'Загрузка…';
                        window.pywebview.api.update_launcher().then(function(updateResult) {
                            if (updateResult.status === 'success') window.pywebview.api.close_app();
                            else { button.disabled = false; button.innerText = updateResult.message || 'Ошибка обновления'; }
                        });
                    };
                    window.receiveLauncherNotification({category:'updates', title:'Доступно обновление v' + result.latest_version, body: result.release_notes || 'Новая версия готова к установке.'});
                    return;
                }
                button.disabled = false;
                button.innerText = result.message || 'Установлена последняя версия';
            }).catch(function(error) {
                button.disabled = false;
                button.innerText = 'Ошибка проверки';
                alert(error);
            });
        }

        function escapeNotificationText(value) {
            const div = document.createElement('div');
            div.textContent = value == null ? '' : String(value);
            return div.innerHTML;
        }

        function notificationTime(timestamp) {
            if (!timestamp) return 'только что';
            return new Date(timestamp * 1000).toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
        }

        function loadNotifications() {
            if (!(window.pywebview && window.pywebview.api)) return;
            window.pywebview.api.get_launcher_notifications().then(function(items) {
                launcherNotifications = items || [];
                if (!launcherNotifications.length) {
                    launcherNotifications = [{id:'welcome', category:'system', title:'Добро пожаловать!', body:'Здесь будут коды подтверждения, сообщения и важные события.', created_at:0, is_read:false}];
                }
                renderNotifications();
            });
        }

        function renderNotifications() {
            const list = document.getElementById('notification-list');
            if (!list) return;
            const visible = launcherNotifications.filter(item => notificationCategory === 'all' || item.category === notificationCategory);
            list.innerHTML = visible.length ? visible.map(item => `
                <div class="notification-item ${item.is_read ? '' : 'unread'}">
                    <div class="notification-title">${escapeNotificationText(item.title)}</div>
                    <div class="notification-body">${escapeNotificationText(item.body)}</div>
                    <div class="notification-time">${notificationTime(item.created_at)}</div>
                </div>`).join('') : '<div style="padding:20px;text-align:center;color:var(--text-muted);">Новых событий нет</div>';
            const unread = launcherNotifications.filter(item => !item.is_read).length;
            const badge = document.getElementById('notification-badge');
            badge.innerText = unread > 99 ? '99+' : unread;
            badge.style.display = unread ? 'flex' : 'none';
            document.querySelectorAll('.notification-tabs button').forEach(function(tab) {
                const category = tab.dataset.category;
                const count = launcherNotifications.filter(item => !item.is_read && (category === 'all' || item.category === category)).length;
                const categoryBadge = tab.querySelector('.category-badge');
                if (categoryBadge) categoryBadge.innerText = count ? (count > 99 ? '99+' : count) : '';
            });
        }

        function toggleNotificationCenter() {
            const panel = document.getElementById('notification-panel');
            panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
            if (panel.style.display === 'flex') {
                loadNotifications();
                markNotificationCategoryRead('all');
            }
        }

        function filterNotifications(category, button) {
            notificationCategory = category;
            document.querySelectorAll('.notification-tabs button').forEach(item => item.classList.remove('active'));
            button.classList.add('active');
            renderNotifications();
            markNotificationCategoryRead(category);
        }

        function markNotificationCategoryRead(category) {
            const ids = launcherNotifications
                .filter(item => !item.is_read && (category === 'all' || item.category === category))
                .map(item => item.id)
                .filter(id => id && !String(id).startsWith('runtime-') && id !== 'welcome');
            launcherNotifications.forEach(item => {
                if (category === 'all' || item.category === category) item.is_read = true;
            });
            renderNotifications();
            if (window.pywebview && window.pywebview.api && ids.length) {
                window.pywebview.api.mark_launcher_notifications_read(ids).then(loadNotifications);
            }
        }

        function markAllNotificationsRead() {
            markNotificationCategoryRead('all');
        }

        function loadTodoTasks() {
            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.get_todo_tasks().then(function(tasks) {
                    const container = document.getElementById('todo-tasks-container');
                    container.innerHTML = '';

                    if (tasks.length === 0) {
                        container.innerHTML = '<p style="color: var(--text-muted); text-align:center;">Заметок пока нет. Добавьте первую!</p>';
                        return;
                    }

                    tasks.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'todo-item';
                        div.innerHTML = `
                            <span>${item.task}</span>
                            <button class="todo-delete-btn" onclick="deleteTodoItem(${item.id})">✕</button>
                        `;
                        container.appendChild(div);
                    });
                });
            }
        }

        function addTodoItem() {
            const input = document.getElementById('todo-text-input');
            const text = input.value.strip ? input.value.strip() : input.value.trim();

            if (!text) return;

            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.add_todo_task(text).then(function(res) {
                    if (res.status === 'success') {
                        input.value = ''; // Очищаем поле ввода
                        loadTodoTasks();  // Перерисовываем список задач из БД
                    }
                });
            }
        }

        function deleteTodoItem(id) {
            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.delete_todo_task(id).then(function(res) {
                    if (res.status === 'success') {
                        loadTodoTasks(); // Обновляем список задач из БД
                    }
                });
            }
        }

        const chatRam = {
            histories: new Map(),

        function getPendingMessages(partner) {
            if (!chatRam.pending.has(partner)) chatRam.pending.set(partner, []);
            return chatRam.pending.get(partner);
        }

        function rememberChatHistory(partner, messages) {
            chatRam.histories.set(partner, Array.isArray(messages) ? messages : []);
        }

        function getRenderedMessages(partner, messages) {
            const base = Array.isArray(messages) ? messages : (chatRam.histories.get(partner) || []);
            return base.concat(getPendingMessages(partner));
        }

        function formatLastSeen(ts) {
            if (!ts) return 'был(а) давно';
            const now = Date.now()/1000;
            const diff = Math.floor(now - ts);
            if (diff < 5) return 'в сети';
            const mins = Math.floor(diff/60);
            if (mins < 2) return 'был(а) только что';
            if (mins < 5) return 'был(а) 2 мин. назад';
            if (mins < 15) return `был(а) ${mins} мин. назад`;
            if (mins < 60) return 'был(а) менее часа назад';
            const hours = Math.floor(mins/60);
            if (hours < 24) return hours === 1 ? 'был(а) более часа назад' : `был(а) ${hours} ч. назад`;
            return 'был(а) давно';
        }

            timeEl.classList.toggle('sending', false);

        function sendOutgoingMessage(content, isImage) {
            if (!currentPartner) { alert('Выберите контакт'); return; }
            if (!(window.pywebview && window.pywebview.api)) {
                alert('Python API недоступен');
                return;
            }

            const partnerAtSend = currentPartner;
            const pendingMsg = {
                local_id: 'local-' + Date.now() + '-' + Math.random().toString(16).slice(2),
                sender: 'Вы',
                text: content,
                time: '',
                is_me: true,
                is_image: !!isImage,
                is_read: false,
                pending: true
            };
            getPendingMessages(partnerAtSend).push(pendingMsg);
            const localMessage = appendLocalMessage(content, isImage, pendingMsg);

            window.pywebview.api.send_launcher_message(partnerAtSend, content)
                .then(function(res) {
                    if (res && res.status === 'success') {
                        pendingMsg.pending = false;
                        setLocalMessageStatus(localMessage, 'success');
                        window.pywebview.api.get_chat_history_for_js(partnerAtSend).then(function(messages) {
                            clearDeliveredPending(partnerAtSend, pendingMsg);
                            rememberChatHistory(partnerAtSend, messages);
                            if (currentPartner === partnerAtSend) {
                                renderChatMessages(messages, partnerAtSend);
                            }
                        });
                    } else {
                        pendingMsg.error = true;
                        setLocalMessageStatus(localMessage, 'error', (res && res.message) || 'Ошибка отправки');
                    }
                })
                .catch(function(err) {
                    pendingMsg.error = true;
                    setLocalMessageStatus(localMessage, 'error', 'Ошибка отправки: ' + err);
                });
        }

        window.sendChatMessage = function() {
            const input = document.getElementById('chat-message-input');
            if (!input) return;
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            sendOutgoingMessage(text, false);
        };

        window.sendImageFile = function(evt) {
            const files = evt.target.files;
            if (!files || files.length === 0) return;
            if (!currentPartner) { alert('Выберите контакт'); evt.target.value = ''; return; }

            const reader = new FileReader();
            reader.onload = function(e) {
                evt.target.value = '';
                sendOutgoingMessage(e.target.result, true);
            };
            reader.readAsDataURL(files[0]);
        };

        window.insertEmoji = function(emoji) {
            const picker = document.getElementById('emoji-picker');
            if (picker) picker.style.display = 'none';
            sendOutgoingMessage(emoji, false);
        };

        function renderChatMessages(messages, partner) {
            const container = document.getElementById('chat-history-container');
            if (!container) return;

            container.innerHTML = '';
            container.style.display = 'flex';
            const visiblePartner = partner || currentPartner;
            const renderedMessages = getRenderedMessages(visiblePartner, messages);

            if (!renderedMessages || renderedMessages.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:gray;">Нет сообщений</div>';
                return;
            }

            renderedMessages.forEach(msg => {
                const sender = msg.sender ?? msg[0] ?? '';
                const text = msg.text ?? msg[1] ?? '';
                const time = msg.time ?? '';
                const isMy = msg.is_me ? 'my-msg' : 'other-msg';
                const div = document.createElement('div');
                const contentHTML = buildMessageContent(text, msg.is_image);
                const statusText = msg.error ? 'ошибка отправки' : (msg.pending ? 'отправляется...' : (msg.is_read ? '✓✓ прочитано' : '✓✓ доставлено'));
                const readMark = msg.is_me ? ` <span class="msg-read-mark">${statusText}</span>` : '';

                div.className = `chat-message ${isMy}${msg.pending ? ' sending' : ''}`;
                if (msg.local_id) div.dataset.localId = msg.local_id;
                div.innerHTML = `<div class="msg-meta">${sender}</div>${contentHTML}<div class="msg-time">${time}${readMark}</div>`;
                container.appendChild(div);
            });

            if (!isUserScrollingUp) {
                container.scrollTop = container.scrollHeight;
            }
        }

        window.renderMessages = renderChatMessages;

        window.selectContact = function(name) {
            currentPartner = name;

            const partnerName = document.getElementById('chat-partner-name');
            const historyContainer = document.getElementById('chat-history-container');
            const inputPanel = document.getElementById('chat-input-panel');
            const msgInput = document.getElementById('chat-message-input');

            if (partnerName) partnerName.innerText = name;
            if (historyContainer) {
                historyContainer.style.display = 'flex';
                const cached = chatRam.histories.get(name);
                if (cached) {
                    renderChatMessages(cached, name);
                } else {
                    historyContainer.innerHTML = '<p style="color:var(--text-muted); padding:10px;">Загрузка...</p>';
                }
            }
            if (inputPanel) inputPanel.style.display = 'flex';
            if (msgInput) {
                msgInput.disabled = false;
                msgInput.focus();
            }

            if (!(window.pywebview && window.pywebview.api)) return;

            window.pywebview.api.get_chat_history_for_js(name)
                .then(function(messages) {
                    rememberChatHistory(name, messages);
                    renderChatMessages(messages, name);
                })
                .catch(function(err) {
                    alert('Ошибка Python: ' + err);
                });
        };

    </script>
</body>
</html>
