name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.3"
        required: true
      notes:
        description: "Release notes"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if (-not $version) { $version = "${{ github.ref_name }}".TrimStart("v") }
          Set-Content -Path VERSION -Value $version -NoNewline
          "release_version=$version" >> $env:GITHUB_OUTPUT
        id: version
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: pyinstaller --clean --noconfirm main.spec
      - name: Package release
        shell: pwsh
        run: Compress-Archive -Path dist/main/* -DestinationPath "launcher-${{ steps.version.outputs.release_version }}.zip"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.release_version }}
          name: Launcher v${{ steps.version.outputs.release_version }}
          body: ${{ inputs.notes }}
          files: launcher-${{ steps.version.outputs.release_version }}.zip
